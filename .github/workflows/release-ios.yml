name: Release the iPhone app

# Builds an UNSIGNED iOS app from the private source repository, signs the file with the release key and publishes
# it here. Vantage Link on the user's PC picks up the highest ios-v* release and signs it for their own iPhone with
# their own Apple ID.
# Run it from the Actions tab, or: gh workflow run release-ios.yml -f version=1.0.0 -f publish=true
#
# With publish off (the default) everything runs, but the result is a DRAFT release that only collaborators can see.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release number, e.g. 1.0.0. Vantage Link installs the highest one.'
        required: true
        type: string
      ref:
        description: 'Branch, tag or commit of the source repository to build'
        required: true
        default: master
        type: string
      publish:
        description: 'Publish for real (off: a private draft release)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  SOURCE_REPO: acciaw/valorant_app
  TAG: ios-v${{ inputs.version }}
  GH_TOKEN: ${{ github.token }}
  # The EAS Update channel this build listens to: the one `npm run ship` publishes to.
  UPDATE_CHANNEL: preview

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: src

      - name: Check the release
        run: |
          state="$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$state" = "false" ]; then echo "::error::$TAG is already published; release a higher number instead"; exit 1; fi
          if [ "$state" = "true" ]; then gh release delete "$TAG" --repo "${{ github.repository }}" --yes; fi
          echo "SOURCE_SHA=$(git -C src rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        working-directory: src
        run: npm ci

      # Generates ios/ (git-ignored in the source repo; the project uses Continuous Native Generation).
      - name: Prebuild
        working-directory: src
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: src/ios
        run: pod install

      # iOS asks permission before an app talks to devices on the home network, and needs a reason to show. It's added
      # here rather than in app.json because any app.json change alters the fingerprint that Android's over-the-air
      # updates are matched on (it hashes the whole config, not one platform's part).
      - name: Add the local network permission text
        working-directory: src
        run: |
          info="$(find ios -maxdepth 2 -name Info.plist | head -1)"
          text="Vantage connects to Vantage Link on your PC, over your home network, to hide your VALORANT status and show what it is doing."
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string $text" "$info" \
            || /usr/libexec/PlistBuddy -c "Set :NSLocalNetworkUsageDescription $text" "$info"
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$info"

      # A build made outside EAS Build has to name its update channel itself (EAS Build normally writes it from eas.json).
      - name: Point the build at its update channel
        working-directory: src
        run: |
          plist="$(find ios -name Expo.plist -not -path '*/Pods/*' | head -1)"
          echo "Expo.plist: $plist"
          /usr/libexec/PlistBuddy -c "Add :EXUpdatesRequestHeaders dict" "$plist" || true
          /usr/libexec/PlistBuddy -c "Add :EXUpdatesRequestHeaders:expo-channel-name string $UPDATE_CHANNEL" "$plist" \
            || /usr/libexec/PlistBuddy -c "Set :EXUpdatesRequestHeaders:expo-channel-name $UPDATE_CHANNEL" "$plist"
          /usr/libexec/PlistBuddy -c "Print :EXUpdatesRequestHeaders" "$plist"
          /usr/libexec/PlistBuddy -c "Print :EXUpdatesRuntimeVersion" "$plist" || true

      # Unsigned on purpose: Vantage Link signs it for each user's own iPhone.
      - name: Archive
        working-directory: src
        run: |
          set -o pipefail
          workspace="$(ls -d ios/*.xcworkspace | head -1)"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild archive \
            -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 80

      - name: Package the IPA
        run: |
          app="$(ls -d "$RUNNER_TEMP"/App.xcarchive/Products/Applications/*.app | head -1)"
          mkdir -p dist/Payload
          cp -R "$app" dist/Payload/
          (cd dist && zip -qry Vantage.ipa Payload && rm -rf Payload)
          ls -la dist

      - name: Build the signing tool
        run: |
          rustup update stable --no-self-update
          cargo build --release --locked --manifest-path src/desktop/tools/vl-sign/Cargo.toml

      - name: Sign
        env:
          VL_SIGNING_KEY: ${{ secrets.VL_SIGNING_KEY }}
        run: |
          sign=src/desktop/tools/vl-sign/target/release/vl-sign
          "$sign" sign dist/Vantage.ipa
          "$sign" verify dist/Vantage.ipa --key src/desktop/release-key.pub

      - name: Release
        run: |
          flags="--draft"
          if [ "${{ inputs.publish }}" = "true" ]; then flags=""; fi
          gh release create "$TAG" dist/Vantage.ipa dist/Vantage.ipa.sig \
            --repo "${{ github.repository }}" --title "Vantage ${{ inputs.version }} (iPhone)" \
            --notes "Unsigned iPhone build (source $SOURCE_SHA). Vantage Link on your PC signs and installs it for you." $flags
